<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Settings | TechCampus_Hub</title>
        <meta name="description" content="TechCampus_Hub - College learning portal for study notes, TNP resources, previous year papers and exam timetables.">
        <meta name="theme-color" content="#102a56">
        <link rel="icon" type="image/png" href="./assets/logo.png">
        <link rel="apple-touch-icon" href="./assets/logo.png">
        <!-- =====================================================
         TAILWIND CSS
    ====================================================== -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- =====================================================
         FONT AWESOME
    ====================================================== -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <!-- =====================================================
         TAILWIND CONFIG
    ====================================================== -->
        <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: "#102a56",
                        bluehub: "#2563eb",
                        softbg: "#f5f8fc"
                    },

                    boxShadow: {
                        soft: "0 8px 28px rgba(15,39,74,.08)"
                    }
                }
            }
        };
        </script>
        <!-- =====================================================
         CUSTOM CSS
    ====================================================== -->
        <link rel="stylesheet" href="style.css">
    </head>
<body data-page="settings">
        <div id="dashboardSection" class="min-h-screen">
            <div id="pageChrome"></div>
                <!-- =====================================================
         MAIN AREA
    ====================================================== -->
                <main class="main-area
               md:ml-64
               min-h-screen">
                    <div id="pageHeader"></div>
                    <!-- =================================================
             PAGE CONTENT
        ================================================== -->
                    <div class="p-5
                   md:p-8
                   max-w-[1500px]
                   mx-auto">
                        <!-- ================= SETTINGS ================= -->
                        <section id="settingsPage" class="card p-6 mb-5">
                            <div class="flex items-center gap-4 mb-6">
                                <div class="w-12 h-12 rounded-xl
                   bg-slate-100 text-slate-700
                   flex items-center justify-center
                   text-xl">
                                    <i class="fa-solid fa-gear"></i>
                                </div>
                                <div>
                                    <h2 class="text-xl font-extrabold">
                                        Settings
                                    </h2>
                                    <p class="text-sm text-slate-500">
                                        Manage your account preferences
                                    </p>
                                </div>
                            </div>
                            <!-- Account Settings -->
                            <div class="border rounded-xl p-5 mb-5">
                                <h3 class="font-bold text-lg mb-4">
                                    Account Settings
                                </h3>
                                <div class="space-y-4">
                                    <div class="flex items-center
                       justify-between gap-4">
                                        <div>
                                            <p class="font-semibold">
                                                Account Information
                                            </p>
                                            <p class="text-sm text-slate-500">
                                                Manage your profile information
                                            </p>
                                        </div>
                                        <a id="settingsProfileBtn" href="./profile.html" class="inline-block px-4 py-2
                           rounded-lg
                           bg-blue-600
                           text-white
                           font-semibold">
                                            Profile
                                        </a>
                                    </div>
                                </div>
                            </div>
                            <!-- Notification Settings -->
                            <div class="border rounded-xl p-5 mb-5">
                                <h3 class="font-bold text-lg mb-4">
                                    Notification Settings
                                </h3>
                                <label class="flex items-center
                   justify-between gap-4
                   cursor-pointer">
                                    <div>
                                        <p class="font-semibold">
                                            Notifications
                                        </p>
                                        <p class="text-sm text-slate-500">
                                            Receive updates about new resources
                                        </p>
                                    </div>
                                    <input
                                        id="notificationSettingToggle"
                                        type="checkbox"
                                        class="w-5 h-5"
                                        checked
                                    >
                                </label>
                            </div>
                        </section>
                    </div>
                </main>
            </div>
        <script src="./js/env.js"></script>
        <script type="module" src="./js/app.js"></script>
    </body>
</html>
