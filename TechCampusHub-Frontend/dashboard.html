<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard | TechCampus_Hub</title>
        <meta name="description" content="TechCampus_Hub - College learning portal for study notes, TNP resources, previous year papers and exam timetables.">
        <meta name="theme-color" content="#102a56">
        <link rel="icon" type="image/png" href="./assets/logo.png">
        <link rel="apple-touch-icon" href="./assets/logo.png">
        <!-- =====================================================
         TAILWIND CSS
    ====================================================== -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- =====================================================
         FONT AWESOME
    ====================================================== -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <!-- =====================================================
         TAILWIND CONFIG
    ====================================================== -->
        <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: "#102a56",
                        bluehub: "#2563eb",
                        softbg: "#f5f8fc"
                    },

                    boxShadow: {
                        soft: "0 8px 28px rgba(15,39,74,.08)"
                    }
                }
            }
        };
        </script>
        <!-- =====================================================
         CUSTOM CSS
    ====================================================== -->
        <link rel="stylesheet" href="style.css">
    </head>
<body data-page="dashboard">
        <div id="dashboardSection" class="min-h-screen">
            <div id="pageChrome"></div>
                <!-- =====================================================
         MAIN AREA
    ====================================================== -->
                <main class="main-area
               md:ml-64
               min-h-screen">
                    <div id="pageHeader"></div>
                    <!-- =================================================
             PAGE CONTENT
        ================================================== -->
                    <div class="p-5
                   md:p-8
                   max-w-[1500px]
                   mx-auto">
                        <!-- =================================================
                 WELCOME
            ================================================== -->
                        <section class="card
                       p-5
                       md:p-6
                       mb-5">
                            <div class="flex
                           flex-col
                           md:flex-row
                           md:items-center
                           justify-between
                           gap-5">
                                <!-- Left: welcome block (unchanged) -->
                                <div class="flex
                           items-center
                           gap-4
                           text-center">
                                    <div class="w-14
                               h-14
                               rounded-2xl
                               bg-blue-50
                               flex
                               items-center
                               justify-center
                               text-blue-700
                               text-2xl">
                                        <i class="fa-solid
                                   fa-graduation-cap"></i>
                                    </div>
                                    <div>
                                        <p class="text-slate-500
                                   text-sm">
                                            Welcome Back
                                        </p>
                                        <h2 id="profileNameWelcome" class="text-2xl
                                   md:text-3xl
                                   font-extrabold">
                                            Student!
                                        </h2>
                                        <p class="text-slate-500
                                   mt-1">
                                            Keep learning,
                                    keep growing.
                                        </p>
                                        <p id="dashboardAccessLine"
                                           class="text-xs font-bold mt-2
                                                  text-slate-400">
                                        </p>
                                    </div>
                                </div>
                                <!-- Right: AI Chatbot (moved here from the quick-
                                     access grid; same id, so the existing
                                     chatbot.js wiring keeps working) -->
                                <button id="openGeminiBtn" type="button"
                                    class="resource-card
                                   flex
                                   items-center
                                   gap-4
                                   rounded-2xl
                                   border border-slate-200
                                   bg-white
                                   px-4
                                   py-3
                                   hover:bg-slate-50
                                   transition
                                   text-left
                                   w-full
                                   md:w-auto
                                   shrink-0">
                                    <span class="w-12
                                   h-12
                                   rounded-xl
                                   bg-gradient-to-br
                                   from-violet-500
                                   to-fuchsia-500
                                   text-white
                                   flex
                                   items-center
                                   justify-center
                                   text-xl
                                   shrink-0">
                                        <i class="fa-solid
                                   fa-robot"></i>
                                    </span>
                                    <span class="min-w-0">
                                        <span class="block
                                   font-extrabold">
                                            AI Chatbot
                                        </span>
                                        <span class="block
                                   text-xs
                                   text-slate-500">
                                            Ask Google Gemini for study help
                                        </span>
                                    </span>
                                    <span class="ml-2
                                   rounded-xl
                                   bg-violet-600
                                   text-white
                                   px-4
                                   py-2
                                   text-sm
                                   font-bold
                                   whitespace-nowrap">
                                        Start Chat
                                    </span>
                                </button>
                            </div>
                        </section>
                        <!-- =================================================
                 QUICK ACCESS
            ================================================== -->
                        <section class="grid
                       xl:grid-cols-4
                       md:grid-cols-2
                       gap-4
                       mb-5">
                            <!-- Notes -->
                            <button
                                data-dashboard-category="notes"
                                data-category="notes"
                                class="resource-card
                           card
                           p-4
                           text-left"
                                type="button"
                            >
                                <div class="flex
                           items-center
                           gap-3">
                                    <div class="w-12
                               h-12
                               rounded-xl
                               bg-blue-50
                               text-blue-600
                               flex
                               items-center
                               justify-center
                               text-xl
                               shrink-0">
                                        <i class="fa-regular
                                   fa-file-lines"></i>
                                    </div>
                                    <h3 class="font-extrabold
                               text-lg">
                                        Notes
                                    </h3>
                                </div>
                                <p class="text-sm
                               text-slate-500
                               mt-1">
                                    Access your study materials
                                </p>
                                <div class="text-blue-600
                               mt-3">
                                    <i class="fa-solid
                                   fa-arrow-right"></i>
                                </div>
                            </button>
                            <!-- TNP -->
                            <button
                                data-dashboard-category="tnp"
                                data-category="tnp"
                                class="resource-card
                           card
                           p-4
                           text-left"
                                type="button"
                            >
                                <div class="flex
                           items-center
                           gap-3">
                                    <div class="w-12
                               h-12
                               rounded-xl
                               bg-emerald-50
                               text-emerald-600
                               flex
                               items-center
                               justify-center
                               text-xl
                               shrink-0">
                                        <i class="fa-solid
                                   fa-briefcase"></i>
                                    </div>
                                    <h3 class="font-extrabold
                               text-lg">
                                        TNP
                                    </h3>
                                </div>
                                <p class="text-sm
                               text-slate-500
                               mt-1">
                                    Training & placement resources
                                </p>
                                <div class="text-emerald-600
                               mt-3">
                                    <i class="fa-solid
                                   fa-arrow-right"></i>
                                </div>
                            </button>
                            <!-- PYQ -->
                            <button
                                data-dashboard-category="pyq"
                                data-category="pyq"
                                class="resource-card
                           card
                           p-4
                           text-left"
                                type="button"
                            >
                                <div class="flex
                           items-center
                           gap-3">
                                    <div class="w-12
                               h-12
                               rounded-xl
                               bg-violet-50
                               text-violet-600
                               flex
                               items-center
                               justify-center
                               text-xl
                               shrink-0">
                                        <i class="fa-solid
                                   fa-book-open"></i>
                                    </div>
                                    <h3 class="font-extrabold
                               text-lg">
                                        PYQ
                                    </h3>
                                </div>
                                <p class="text-sm
                               text-slate-500
                               mt-1">
                                    Previous year questions
                                </p>
                                <div class="text-violet-600
                               mt-3">
                                    <i class="fa-solid
                                   fa-arrow-right"></i>
                                </div>
                            </button>
                            <!-- Timetable -->
                            <button
                                data-dashboard-category="timetable"
                                data-category="timetable"
                                class="resource-card
                           card
                           p-4
                           text-left"
                                type="button"
                            >
                                <div class="flex
                           items-center
                           gap-3">
                                    <div class="w-12
                               h-12
                               rounded-xl
                               bg-amber-50
                               text-amber-600
                               flex
                               items-center
                               justify-center
                               text-xl
                               shrink-0">
                                        <i class="fa-regular
                                   fa-calendar-days"></i>
                                    </div>
                                    <h3 class="font-extrabold
                               text-lg">
                                        Exam Timetable
                                    </h3>
                                </div>
                                <p class="text-sm
                               text-slate-500
                               mt-1">
                                    View your exam schedule
                                </p>
                                <div class="text-amber-600
                               mt-3">
                                    <i class="fa-solid
                                   fa-arrow-right"></i>
                                </div>
                            </button>
                        </section>
                        <!-- =================================================
                 RESOURCE SUMMARY
            ================================================== -->
                        <section class="grid
                       lg:grid-cols-3
                       gap-5
                       mb-5">
                            <div class="card
                           p-5
                           lg:col-span-2">
                                <div class="flex
                               items-center
                               justify-between">
                                    <div>
                                        <p class="text-sm
                                       text-slate-500">
                                            Resources Found
                                        </p>
                                        <p id="totalNotesCount" class="text-3xl
                                       font-extrabold
                                       mt-1">
                                            0
                                        </p>
                                    </div>
                                    <div class="w-12
                                   h-12
                                   rounded-xl
                                   bg-blue-50
                                   text-blue-600
                                   flex
                                   items-center
                                   justify-center
                                   text-xl">
                                        <i class="fa-solid
                                       fa-layer-group"></i>
                                    </div>
                                </div>
                            </div>
                            <div class="card p-5">
                                <p class="text-sm
                               text-slate-500">
                                    Current Category
                                </p>
                                <p id="categoryDisplay" class="text-xl
                               font-extrabold
                               mt-1">
                                    Notes
                                </p>
                            </div>
                        </section>
                        <!-- =================================================
                 SMART SEARCH (content search inside uploaded PDFs)
            ================================================== -->
                        <section id="searchFiltersSection" class="card p-5 md:p-6 mb-5">
                            <div class="flex items-center justify-between mb-5">
                                <div>
                                    <h2 class="text-lg font-extrabold">Smart Search</h2>
                                    <p class="text-sm text-slate-500">
                                        Search inside every note, PYQ and study material &mdash; not just titles
                                    </p>
                                </div>
                                <span id="currentCategoryLabel" class="text-sm font-bold text-blue-600">
                                    Notes
                                </span>
                            </div>
                            <!-- CATEGORY SELECT (app category state, not visible) -->
                            <select id="searchCategory" class="hidden">
                                <option value="notes">Notes</option>
                                <option value="tnp">TNP</option>
                                <option value="pyq">Previous Year Papers</option>
                                <option value="timetable">Exam Timetable</option>
                            </select>
                            <!-- SEARCH BOX -->
                            <div class="relative" id="smartSearchWrap">
                                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                                <input
                                    id="smartSearchInput"
                                    class="input pl-11 pr-11"
                                    type="search"
                                    autocomplete="off"
                                    placeholder="Search a topic inside your PDFs... e.g. Oops, Normalization"
                                >
                                <i id="smartSearchSpinner" class="hidden fa-solid fa-circle-notch fa-spin absolute right-4 top-1/2 -translate-y-1/2 text-blue-600"></i>
                                <!-- SUGGESTIONS -->
                                <div id="smartSearchSuggestions" class="hidden absolute left-0 right-0 top-full mt-2 z-30 rounded-xl border border-slate-200 bg-white shadow-xl p-2 max-h-64 overflow-auto"></div>
                            </div>
                            <!-- SEARCH HISTORY -->
                            <div id="smartSearchHistory" class="hidden mt-3 flex flex-wrap items-center gap-2"></div>
                            <!-- RESULTS / STATES -->
                            <div id="smartSearchResults" class="mt-5 space-y-3"></div>
                        </section>
                        <!-- =================================================
                 RESOURCE LIST
            ================================================== -->
                        <section id="resourceList" class="card
                       p-5
                       md:p-6
                       mb-5">
                            <div class="flex
                           items-center
                           justify-between
                           mb-4">
                                <div>
                                    <h2 class="text-xl
                                   font-extrabold" id="resourceListTitle">
                                        Study Notes
                                    </h2>
                                    <p class="text-sm
                                   text-slate-500
                                   mt-1">
                                        Available college resources
                                    </p>
                                </div>
                                <i class="fa-solid
                               fa-folder-open
                               text-emerald-600
                               text-xl"></i>
                            </div>
                            <div id="notesContainer" class="grid
                           md:grid-cols-2
                           xl:grid-cols-3
                           gap-4"></div>
                        </section>
                    </div>
                </main>
            </div>
        <script src="./js/env.js"></script>
        <script type="module" src="./js/app.js"></script>
    </body>
</html>
