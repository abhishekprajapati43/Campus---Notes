                    <!-- =================================================
             HEADER
        ================================================== -->
                    <header class="app-header
                   h-20
                   flex
                   items-center
                   justify-between
                   px-4
                   md:px-7
                   sticky
                   top-0
                   z-20">
                        <!-- LEFT HEADER -->
                        <div class="flex
                       items-center
                       gap-3">
                            <!-- Mobile menu -->
                            <button id="mobileMenuBtn" aria-label="Open menu" class="mobile-nav
                       w-10
                       h-10
                       rounded-xl
                       bg-slate-100
                       hover:bg-slate-200
                       items-center
                       justify-center
                       text-slate-600" type="button">
                                <i class="fa-solid
                               fa-bars"></i>
                            </button>
                            <div class="flex
                       items-center
                       gap-3">
                                <div class="text-logo-icon-small">
                                    <img src="./assets/logo.png" alt="TechCampus Hub logo">
                                </div>
                                <div class="hidden
                       sm:block">
                                    <h1 id="headerTitle" class="text-xl
                                   font-extrabold
                                   tracking-tight
                                   text-slate-900">
                                        TechCampus_Hub
                                    </h1>
                                    <p id="headerSubtitle" class="text-xs
                                   font-medium
                                   text-slate-500">
                                        College Learning Portal
                                    </p>
                                </div>
                            </div>
                        </div>
                        <!-- RIGHT: theme toggle + profile menu (students +
                             faculty; profile stays hidden for administrators
                             so admin pages keep their own layout) -->
                        <div class="flex items-center gap-3">
                            <button id="themeToggleBtn" type="button" class="theme-toggle
                                   w-10 h-10
                                   rounded-xl
                                   bg-slate-100
                                   hover:bg-slate-200
                                   flex items-center
                                   justify-center
                                   text-slate-600"
                                    aria-label="Switch to dark mode">
                                <i class="fa-solid fa-moon theme-icon-moon"></i>
                                <i class="fa-solid fa-sun theme-icon-sun"></i>
                            </button>
                            <div id="headerProfileMenu" class="hidden relative">
                            <button id="headerProfileBtn" type="button"
                                    aria-haspopup="true" aria-expanded="false"
                                    class="flex items-center gap-3 rounded-full border border-slate-200
                                           pl-1 pr-3 py-1 bg-white shadow-xs
                                           hover:bg-slate-50 hover:border-slate-300 transition">
                                <span id="headerProfilePhoto" class="w-9 h-9 shrink-0
                                      rounded-full bg-blue-600 text-white overflow-hidden
                                      flex items-center justify-center
                                      ring-2 ring-white">
                                    <i class="fa-solid fa-user"></i>
                                </span>
                                <span class="hidden sm:block text-left min-w-0">
                                    <span id="headerProfileName" class="block text-sm
                                          font-bold text-slate-800 truncate
                                          max-w-[160px]">Student</span>
                                    <span id="headerProfileRole" class="block text-[11px] font-medium text-slate-500">Student</span>
                                </span>
                                <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
                            </button>
                            <div id="headerProfileDropdown" class="hidden absolute
                                 right-0 top-full mt-2 w-56 rounded-2xl border
                                 border-slate-200 bg-white p-1.5 shadow-lg z-30">
                                <a id="headerMyProfileBtn" href="./faculty.html#profile"
                                   class="flex items-center gap-3 rounded-xl px-3 py-2.5
                                          text-sm font-semibold text-slate-700
                                          hover:bg-slate-100 transition">
                                    <i class="fa-regular fa-user w-4"></i> My Profile
                                </a>
                                <button id="headerChangePasswordBtn" type="button"
                                        class="w-full flex items-center gap-3 rounded-xl
                                               px-3 py-2.5 text-sm font-semibold
                                               text-slate-700 hover:bg-slate-100 transition">
                                    <i class="fa-solid fa-key w-4"></i> Change Password
                                </button>
                                <div class="my-1 border-t border-slate-100"></div>
                                <button id="headerLogoutBtn" type="button"
                                        class="w-full flex items-center gap-3 rounded-xl
                                               px-3 py-2.5 text-sm font-semibold
                                               text-red-600 hover:bg-red-50 transition">
                                    <i class="fa-solid fa-right-from-bracket w-4"></i> Logout
                                </button>
                            </div>
                            </div>
                        </div>
                    </header>
