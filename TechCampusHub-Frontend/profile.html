<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Profile | TechCampus_Hub</title>
        <meta name="description" content="TechCampus_Hub - College learning portal for study notes, TNP resources, previous year papers and exam timetables.">
        <meta name="theme-color" content="#102a56">
        <link rel="icon" type="image/png" href="./assets/logo.png">
        <link rel="apple-touch-icon" href="./assets/logo.png">
        <!-- =====================================================
         TAILWIND CSS
    ====================================================== -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- =====================================================
         FONT AWESOME
    ====================================================== -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <!-- =====================================================
         TAILWIND CONFIG
    ====================================================== -->
        <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: "#102a56",
                        bluehub: "#2563eb",
                        softbg: "#f5f8fc"
                    },

                    boxShadow: {
                        soft: "0 8px 28px rgba(15,39,74,.08)"
                    }
                }
            }
        };
        </script>
        <!-- =====================================================
         CUSTOM CSS
    ====================================================== -->
        <link rel="stylesheet" href="style.css">
    </head>
<body data-page="profile">
        <div id="dashboardSection" class="min-h-screen">
            <div id="pageChrome"></div>
                <!-- =====================================================
         MAIN AREA
    ====================================================== -->
                <main class="main-area
               md:ml-64
               min-h-screen">
                    <div id="pageHeader"></div>
                    <!-- =================================================
             PAGE CONTENT
        ================================================== -->
                    <div class="p-5
                   md:p-8
                   max-w-[1500px]
                   mx-auto">
                        <!-- ================= PROFILE ================= -->
                        <section id="profilePage" class="card p-6 mb-5">
                            <div class="flex items-center gap-4 mb-6">
                                <div class="w-12 h-12 rounded-xl
                   bg-blue-50 text-blue-600
                   flex items-center justify-center
                   text-xl">
                                    <i class="fa-regular fa-user"></i>
                                </div>
                                <div>
                                    <h2 class="text-xl font-extrabold">
                                        My Profile
                                    </h2>
                                    <p class="text-sm text-slate-500">
                                        View your registration details
                                    </p>
                                </div>
                            </div>
                            <!-- Profile Information -->
                            <div class="grid
               grid-cols-1
               md:grid-cols-2
               gap-5">
                                <!-- Name -->
                                <div class="border rounded-xl p-4">
                                    <p class="text-sm
                       text-slate-500
                       mb-1">
                                        Name
                                    </p>
                                    <p id="studentProfilePageName" class="font-bold text-lg">
                                        -
                                    </p>
                                </div>
                                <!-- Email -->
                                <div class="border rounded-xl p-4">
                                    <p class="text-sm
                       text-slate-500
                       mb-1">
                                        Email
                                    </p>
                                    <p id="studentProfilePageEmail" class="font-bold">
                                        -
                                    </p>
                                </div>
                                <!-- Mobile Number -->
                                <div class="border rounded-xl p-4">
                                    <p class="text-sm
                       text-slate-500
                       mb-1">
                                        Mobile Number
                                    </p>
                                    <p id="studentProfilePagePhone" class="font-bold text-lg">
                                        -
                                    </p>
                                </div>
                                <!-- Gender -->
                                <div class="border rounded-xl p-4">
                                    <p class="text-sm
                       text-slate-500
                       mb-1">
                                        Gender
                                    </p>
                                    <p id="studentProfilePageGender" class="font-bold text-lg">
                                        -
                                    </p>
                                </div>
                                <!-- Address -->
                                <div class="border rounded-xl p-4">
                                    <p class="text-sm
                       text-slate-500
                       mb-1">
                                        Address
                                    </p>
                                    <p id="studentProfilePageAddress" class="font-bold">
                                        -
                                    </p>
                                </div>
                                <!-- Registration Date -->
                                <div class="border rounded-xl p-4">
                                    <p class="text-sm
                       text-slate-500
                       mb-1">
                                        Registration Date
                                    </p>
                                    <p id="studentProfilePageRegistered" class="font-bold text-lg">
                                        -
                                    </p>
                                </div>
                                <!-- Course (students only) -->
                                <div data-profile-role="student" class="border rounded-xl p-4">
                                    <p class="text-sm
                       text-slate-500
                       mb-1">
                                        Course
                                    </p>
                                    <p id="studentProfilePageCourse" class="font-bold text-lg">
                                        -
                                    </p>
                                </div>
                                <!-- Semester (students only) -->
                                <div data-profile-role="student" class="border rounded-xl p-4">
                                    <p class="text-sm
                       text-slate-500
                       mb-1">
                                        Semester
                                    </p>
                                    <p id="studentProfilePageSemester" class="font-bold text-lg">
                                        -
                                    </p>
                                </div>
                                <!-- Roll / Enrollment Number (students only) -->
                                <div data-profile-role="student" class="border rounded-xl p-4">
                                    <p class="text-sm
                       text-slate-500
                       mb-1">
                                        Roll / Enrollment Number
                                    </p>
                                    <p id="studentProfilePageEnrollment" class="font-bold text-lg">
                                        -
                                    </p>
                                </div>
                                <!-- Department (faculty only) -->
                                <div data-profile-role="faculty" class="border rounded-xl p-4">
                                    <p class="text-sm
                       text-slate-500
                       mb-1">
                                        Department
                                    </p>
                                    <p id="studentProfilePageDepartment" class="font-bold">
                                        -
                                    </p>
                                </div>
                                <!-- Qualification (faculty only) -->
                                <div data-profile-role="faculty" class="border rounded-xl p-4">
                                    <p class="text-sm
                       text-slate-500
                       mb-1">
                                        Qualification
                                    </p>
                                    <p id="studentProfilePageQualification" class="font-bold">
                                        -
                                    </p>
                                </div>
                                <!-- Experience (faculty only) -->
                                <div data-profile-role="faculty" class="border rounded-xl p-4">
                                    <p class="text-sm
                       text-slate-500
                       mb-1">
                                        Experience
                                    </p>
                                    <p id="studentProfilePageExperience" class="font-bold">
                                        -
                                    </p>
                                </div>
                            </div>
                            <!-- Profile message: same behaviour as the
                                 faculty Profile panel message -->
                            <p id="studentProfileMessage" aria-live="polite"
                               class="hidden text-sm min-h-5 mb-3"></p>
                            <!-- =============================================
                 EDIT PROFILE FORM
                 Mirrors the faculty Profile form, but stays
                 hidden until "Edit Profile" is pressed so the
                 cards above keep displaying the record. Only
                 the fields the backend accepts travel on save
                 (name / phone / course / semester); the rest
                 are read-only, exactly like the faculty panel.
            ============================================== -->
                            <form id="studentProfileForm" class="hidden
                                   grid
                                   grid-cols-1
                                   md:grid-cols-2
                                   gap-4
                                   pt-5
                                   border-t border-slate-200"
                                  data-profile-role="student">
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2" for="studentProfileName">
                                        Full Name
                                    </label>
                                    <input id="studentProfileName" type="text" class="input"
                                           maxlength="120" disabled>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2" for="studentProfileEmail">
                                        Email
                                    </label>
                                    <input id="studentProfileEmail" type="email" class="input"
                                           disabled>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2" for="studentProfilePhone">
                                        Mobile Number
                                    </label>
                                    <input id="studentProfilePhone" type="tel" class="input"
                                           maxlength="20" disabled>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2" for="studentProfileGender">
                                        Gender
                                    </label>
                                    <input id="studentProfileGender" type="text" class="input"
                                           disabled>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2" for="studentProfileAddress">
                                        Address
                                    </label>
                                    <input id="studentProfileAddress" type="text" class="input"
                                           disabled>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2" for="studentProfileRegistered">
                                        Registration Date
                                    </label>
                                    <input id="studentProfileRegistered" type="text" class="input"
                                           disabled>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2" for="studentProfileCourse">
                                        Course
                                    </label>
                                    <input id="studentProfileCourse" type="text" class="input"
                                           maxlength="60" disabled>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2" for="studentProfileSemester">
                                        Semester
                                    </label>
                                    <input id="studentProfileSemester" type="number" class="input"
                                           min="1" max="12" disabled>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2" for="studentProfileEnrollment">
                                        Roll / Enrollment Number
                                    </label>
                                    <input id="studentProfileEnrollment" type="text" class="input"
                                           disabled>
                                </div>
                            </form>
                            <!-- =============================================
                 PROFILE ACTIONS
                 Same look as the faculty Profile panel buttons.
                 Save owns the form above via the form attribute,
                 so the row stays visible while the form is
                 hidden.
            ============================================== -->
                            <div class="mt-6
                                        pt-5
                                        border-t border-slate-200
                                        flex
                                        flex-wrap
                                        gap-3"
                                 data-profile-role="student">
                                <button id="studentProfileEditBtn" type="button"
                                        class="border border-slate-200 hover:bg-slate-50
                                               text-slate-700 rounded-xl font-bold
                                               px-6 py-3 transition">
                                    <i class="fa-solid fa-pen mr-2"></i>Edit Profile
                                </button>
                                <!-- Same id as the faculty panel button: the
                                     shared change-password modal wiring in
                                     initChangePasswordModal() binds exactly
                                     this id on every page. -->
                                <button id="facultyProfileChangePasswordBtn" type="button"
                                        class="border border-slate-200 hover:bg-slate-50
                                               text-slate-700 rounded-xl font-bold
                                               px-6 py-3 transition">
                                    <i class="fa-solid fa-key mr-2"></i>Change Password
                                </button>
                                <button id="studentProfileSaveBtn" type="submit"
                                        form="studentProfileForm"
                                        class="hidden bg-blue-600 hover:bg-blue-700
                                               text-white rounded-xl font-bold
                                               px-6 py-3 transition">
                                    <i class="fa-solid fa-check mr-2"></i>Save Changes
                                </button>
                            </div>
                        </section>
                    </div>
                </main>
            </div>
        <script src="./js/env.js"></script>
        <script type="module" src="./js/app.js"></script>
    </body>
</html>
