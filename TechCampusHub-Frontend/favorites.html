<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Favorites | TechCampus_Hub</title>
        <meta name="description" content="TechCampus_Hub - College learning portal for study notes, TNP resources, previous year papers and exam timetables.">
        <meta name="theme-color" content="#102a56">
        <link rel="icon" type="image/png" href="./assets/logo.png">
        <link rel="apple-touch-icon" href="./assets/logo.png">
        <!-- =====================================================
         THEME (dark mode) - runs before first paint, so a dark-mode
         visitor never sees a flash of light colours
    ====================================================== -->
        <script>
        (function () {
            try {
                var saved = localStorage.getItem("tch-theme");
                var dark = saved
                    ? saved === "dark"
                    : window.matchMedia("(prefers-color-scheme: dark)").matches;

                if (dark) {
                    document.documentElement.classList.add("dark");
                }
            } catch (error) {
                // Private mode: fall back to the light theme.
            }
        })();
        </script>
        <!-- =====================================================
         TAILWIND CSS
    ====================================================== -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- =====================================================
         FONT AWESOME
    ====================================================== -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <!-- =====================================================
         TAILWIND CONFIG
    ====================================================== -->
        <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        navy: "#102a56",
                        bluehub: "#2563eb",
                        softbg: "#f5f8fc"
                    },

                    boxShadow: {
                        soft: "0 8px 28px rgba(15,39,74,.08)"
                    }
                }
            }
        };
        </script>
        <!-- =====================================================
         CUSTOM CSS
    ====================================================== -->
        <link rel="stylesheet" href="style.css">
    </head>
<body data-page="favorites">
        <div id="dashboardSection" class="min-h-screen">
            <div id="pageChrome"></div>
                <!-- =====================================================
         MAIN AREA
    ====================================================== -->
                <main class="main-area
               md:ml-64
               min-h-screen">
                    <div id="pageHeader"></div>
                    <!-- =================================================
             PAGE CONTENT
        ================================================== -->
                    <div class="p-5
                   md:p-8
                   max-w-[1500px]
                   mx-auto">
                        <!-- ================= FAVORITES ================= -->
                        <section id="favoritesPage" class="card p-6 mb-5">
                            <div class="flex items-center gap-4 mb-6">
                                <div class="w-12 h-12 rounded-xl
                   bg-red-50 text-red-500
                   flex items-center justify-center
                   text-xl">
                                    <i class="fa-regular fa-heart"></i>
                                </div>
                                <div>
                                    <h2 class="text-xl font-extrabold">
                                        Favorites
                                    </h2>
                                    <p class="text-sm text-slate-500">
                                        Your saved learning resources
                                    </p>
                                </div>
                            </div>
                            <div id="favoritesList" class="grid grid-cols-1
               md:grid-cols-2
               lg:grid-cols-3
               gap-5">
                                <div id="favoritesEmptyState" class="col-span-full
                   text-center py-12
                   text-slate-500">
                                    <div class="w-16 h-16 mx-auto mb-4
                       rounded-full bg-slate-100
                       flex items-center justify-center
                       text-2xl">
                                        ❤️
                                    </div>
                                    <p class="font-semibold">
                                        No favorites yet
                                    </p>
                                    <p class="text-sm mt-1">
                                        Your saved resources will appear here.
                                    </p>
                                </div>
                            </div>
                        </section>
                    </div>
                </main>
            </div>
        <script src="./js/env.js"></script>
        <script type="module" src="./js/app.js"></script>
    </body>
</html>
