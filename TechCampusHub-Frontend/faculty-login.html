<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Faculty Login | TechCampus_Hub</title>
        <meta name="description" content="TechCampus_Hub faculty sign-in - publish courses, upload notes, TNP resources, previous year papers and exam timetables.">
        <meta name="theme-color" content="#102a56">
        <link rel="icon" type="image/png" href="./assets/logo.png">
        <link rel="apple-touch-icon" href="./assets/logo.png">
        <!-- =====================================================
         TAILWIND CSS
    ====================================================== -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- =====================================================
         FONT AWESOME
    ====================================================== -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <!-- =====================================================
         TAILWIND CONFIG
    ====================================================== -->
        <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: "#102a56",
                        bluehub: "#2563eb",
                        softbg: "#f5f8fc"
                    },

                    boxShadow: {
                        soft: "0 8px 28px rgba(15,39,74,.08)"
                    }
                }
            }
        };
        </script>
        <!-- =====================================================
         CUSTOM CSS
    ====================================================== -->
        <link rel="stylesheet" href="style.css">
    </head>
<body data-page="auth" data-auth-scope="faculty">
        <!-- =========================================================
     FACULTY AUTH SECTION
========================================================= -->
        <section id="authSection" class="min-h-screen grid lg:grid-cols-[1.05fr_1fr]">
            <!-- =================================================
     LEFT BRANDING PANEL
================================================= -->
            <div class="hidden lg:flex
           relative
           flex-col
           justify-between
           p-12
           text-white
           bg-[#0f1f42]
           auth-card
           overflow-hidden">
                <!-- Soft glow accents -->
                <div class="absolute
              -top-24
              -left-24
              w-96
              h-96
              rounded-full
              bg-blue-500/10
              blur-3xl
              pointer-events-none"></div>
                <div class="absolute
              -bottom-32
              -right-20
              w-96
              h-96
              rounded-full
              bg-blue-400/10
              blur-3xl
              pointer-events-none"></div>

                <!-- =================================================
         HEXAGON LOGO + BRAND
    ================================================== -->
                <div class="relative
              flex
              flex-col
              items-center
              justify-center
              flex-1
              text-center">
                    <div class="relative
                 w-36
                 h-36
                 flex
                 items-center
                 justify-center">
                        <svg viewBox="0 0 100 100"
                             class="absolute
                                    inset-0
                                    w-full
                                    h-full"
                             aria-hidden="true">
                            <polygon
                                points="50,3 92,26.5 92,73.5 50,97 8,73.5 8,26.5"
                                fill="none"
                                stroke="rgba(255,255,255,.85)"
                                stroke-width="1.6"
                            ></polygon>
                        </svg>
                        <i class="fa-solid
                   fa-graduation-cap
                   text-5xl
                   text-white"></i>
                    </div>

                    <h1 class="text-4xl
                 font-extrabold
                 tracking-tight
                 mt-8">
                        TechCampus Hub
                    </h1>
                    <p class="text-slate-400
                mt-3
                text-base">
                        Where Learning Never Stops
                    </p>
                </div>

                <!-- =================================================
         STATS
    ================================================== -->
                <div class="relative
              grid
              grid-cols-3
              gap-4
              text-center">
                    <!-- Students -->
                    <div>
                        <p class="text-xl
                   font-extrabold">
                            50K+ Students
                        </p>
                        <p class="text-[11px]
                   uppercase
                   tracking-widest
                   text-slate-500
                   mt-1">
                            Students
                        </p>
                    </div>
                    <!-- Resources -->
                    <div>
                        <p class="text-xl
                   font-extrabold">
                            1.2K+ Resources
                        </p>
                        <p class="text-[11px]
                   uppercase
                   tracking-widest
                   text-slate-500
                   mt-1">
                            Resources
                        </p>
                    </div>
                    <!-- Satisfaction -->
                    <div>
                        <p class="text-xl
                   font-extrabold">
                            98% Satisfaction
                        </p>
                        <p class="text-[11px]
                   uppercase
                   tracking-widest
                   text-slate-500
                   mt-1">
                            Satisfaction
                        </p>
                    </div>
                </div>
            </div>

            <!-- =================================================
     LOGIN CARD
================================================= -->
            <div class="flex
           items-center
           justify-center
           p-6
           sm:p-10
           bg-softbg">
                <div class="w-full
              max-w-md">

                    <!-- Mobile Brand -->
                    <div class="flex
                 items-center
                 gap-3
                 mb-8
                 lg:hidden">
                        <div class="w-12 h-12
                    rounded-2xl
                    bg-white
                    border
                    p-1
                    flex
                    items-center
                    justify-center
                    shadow-soft">
                            <div class="text-logo-icon">
                                <img src="./assets/logo.png" alt="TechCampus Hub logo">
                            </div>
                        </div>
                        <div>
                            <h1 class="text-lg
                       font-extrabold
                       text-navy">
                                TechCampus Hub
                            </h1>
                            <p class="text-xs
                       text-slate-500">
                                Faculty Portal
                            </p>
                        </div>
                    </div>

                    <!-- Back to home -->
                    <a href="./index.html" class="inline-flex
                       items-center
                       gap-2
                       text-sm
                       font-semibold
                       text-slate-500
                       hover:text-blue-600
                       transition
                       mb-5">
                        <i class="fa-solid fa-arrow-left"></i>
                        Back to home
                    </a>

                    <!-- =================================================
                 HEADING
            ================================================== -->
                    <div class="mb-7">
                        <h2 class="text-3xl
                   font-extrabold
                   text-navy">
                            Faculty Login
                        </h2>
                        <p class="text-slate-500
                  mt-2">
                            Sign in to manage your courses
                            and uploads.
                        </p>
                    </div>

                    <!-- =================================================
                 LOGIN FORM
            ================================================== -->
                    <form id="authForm" class="space-y-4">
                        <!-- EMAIL -->
                        <div>
                            <label for="authEmail" class="block
                               text-sm
                               font-semibold
                               mb-2
                               text-slate-700">
                                Email Address
                            </label>
                            <div class="relative">
                                <input
                                    id="authEmail"
                                    autocomplete="email"
                                    class="input
                                       bg-slate-50
                                       pr-11"
                                    type="email"
                                    placeholder="you@example.com"
                                    required
                                >
                                <i class="fa-regular
                                   fa-envelope
                                   absolute
                                   right-4
                                   top-1/2
                                   -translate-y-1/2
                                   text-slate-400"></i>
                            </div>
                        </div>
                        <!-- PASSWORD -->
                        <div>
                            <label for="authPassword" class="block
                               text-sm
                               font-semibold
                               mb-2
                               text-slate-700">
                                Password
                            </label>
                            <div class="relative">
                                <input
                                    id="authPassword"
                                    autocomplete="current-password"
                                    class="input
                                       bg-slate-50
                                       pr-20"
                                    type="password"
                                    placeholder="Enter your password"
                                    required
                                >
                                <i class="fa-solid
                                   fa-lock
                                   absolute
                                   right-11
                                   top-1/2
                                   -translate-y-1/2
                                   text-slate-400"></i>
                                <button
                                    type="button"
                                    id="togglePasswordBtn"
                                    class="absolute
                                       right-4
                                       top-1/2
                                       -translate-y-1/2
                                       text-slate-400
                                       hover:text-slate-600"
                                    aria-label="Show password"
                                >
                                    <i class="fa-regular
                                       fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <!-- SUBMIT -->
                        <button id="authSubmitBtn"
                                type="submit"
                                data-login-label="Sign In"
                                class="w-full
                           bg-[#12294d]
                           hover:bg-[#0d1f3d]
                           text-white
                           font-bold
                           py-3.5
                           rounded-xl
                           transition">
                            Sign In
                        </button>
                        <!-- MESSAGE -->
                        <p id="authMessage" aria-live="polite" class="text-sm
                           text-center
                           min-h-5"></p>
                    </form>

                    <!-- =================================================
                 REQUEST ACCESS
            ================================================== -->
                    <p class="text-center
                  text-sm
                  text-slate-500
                  mt-6">
                        New Faculty?
                        <a href="./login.html?mode=signup&role=faculty" class="font-bold
                           text-navy
                           hover:text-blue-600
                           transition">
                            Request Access
                        </a>
                    </p>
                </div>
            </div>
        </section>
        <script src="./js/env.js"></script>
        <script type="module" src="./js/app.js"></script>
    </body>
</html>
