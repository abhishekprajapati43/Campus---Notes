                    <!-- =================================================
             HEADER
        ================================================== -->
                    <header class="h-24
                   bg-white
                   border-b
                   border-slate-200
                   flex
                   items-center
                   justify-between
                   px-5
                   md:px-8
                   sticky
                   top-0
                   z-20">
                        <!-- LEFT HEADER -->
                        <div class="flex
                       items-center
                       gap-3">
                            <!-- Mobile menu -->
                            <button id="mobileMenuBtn" aria-label="Open menu" class="mobile-nav
                           w-10
                           h-10
                           rounded-xl
                           bg-slate-100
                           items-center
                           justify-center" type="button">
                                <i class="fa-solid
                               fa-bars"></i>
                            </button>
                            <div class="flex
                           items-center
                           gap-3">
                                <div class="text-logo-icon-small">
                                    🎓
                                </div>
                                <div class="hidden
                               sm:block">
                                    <h1 class="text-xl
                                   font-extrabold">
                                        TechCampus_Hub
                                    </h1>
                                    <p class="text-sm
                                   text-slate-500">
                                        College Learning Portal
                                    </p>
                                </div>
                            </div>
                        </div>
                        <!-- =================================================
                 PROFILE
            ================================================== -->
                        <div class="relative">
                            <button id="profileButton" class="flex
                           items-center
                           gap-3
                           px-3
                           sm:px-4
                           py-2.5
                           rounded-xl
                           border
                           border-slate-200
                           bg-white
                           hover:bg-slate-50
                           font-semibold
                           text-slate-700" type="button">
                                <span class="w-9
                               h-9
                               rounded-full
                               bg-blue-600
                               text-white
                               flex
                               items-center
                               justify-center">
                                    <i class="fa-solid
                                   fa-user"></i>
                                </span>
                                <span id="userNameBadge" class="hidden
                               sm:inline">
                                    Student
                                </span>
                                <i class="fa-solid
                               fa-chevron-down
                               text-xs"></i>
                            </button>
                            <!-- PROFILE DROPDOWN -->
                            <div id="adminProfileDropdown" class="hidden
                           absolute
                           right-0
                           mt-2
                           w-80
                           max-w-[calc(100vw-2rem)]
                           bg-white
                           rounded-2xl
                           border
                           border-slate-200
                           shadow-xl
                           p-4
                           z-50">
                                <!-- Profile top -->
                                <div class="flex
                               items-center
                               gap-3
                               pb-3
                               border-b">
                                    <div class="w-11
                                   h-11
                                   rounded-full
                                   bg-blue-100
                                   text-blue-700
                                   flex
                                   items-center
                                   justify-center">
                                        <i class="fa-solid
                                       fa-user"></i>
                                    </div>
                                    <div class="min-w-0">
                                        <p id="adminProfileName" class="font-bold
                                       truncate">
                                            Student
                                        </p>
                                        <p id="adminProfileEmail" class="text-xs
                                       text-slate-500
                                       truncate">
                                            -
                                        </p>
                                    </div>
                                </div>
                                <!-- Profile details -->
                                <div id="studentProfileDetails" class="pt-3
           space-y-2
           text-sm">
                                    <!-- Name -->
                                    <p>
                                        <span class="text-slate-500">
                                            Name:
                                        </span>
                                        <span id="adminProfileNameDetail" class="font-semibold">
                                            -
                                        </span>
                                    </p>
                                    <!-- Course -->
                                    <p>
                                        <span class="text-slate-500">
                                            Course:
                                        </span>
                                        <span id="profileCourse" class="font-semibold">
                                            -
                                        </span>
                                    </p>
                                    <!-- Branch -->
                                    <p>
                                        <span class="text-slate-500">
                                            Branch:
                                        </span>
                                        <span id="profileBranch" class="font-semibold">
                                            -
                                        </span>
                                    </p>
                                    <!-- Year -->
                                    <p>
                                        <span class="text-slate-500">
                                            Year:
                                        </span>
                                        <span id="profileYear" class="font-semibold">
                                            -
                                        </span>
                                    </p>
                                    <!-- Semester -->
                                    <p>
                                        <span class="text-slate-500">
                                            Semester:
                                        </span>
                                        <span id="profileSemester" class="font-semibold">
                                            -
                                        </span>
                                    </p>
                                    <!-- Administrator Role -->
                                    <p id="adminRoleDetail" class="hidden">
                                        <span class="text-slate-500">
                                            Role:
                                        </span>
                                        <span class="font-semibold">
                                            Administrator
                                        </span>
                                    </p>
                                </div>
                                <!-- Profile actions -->
                                <div class="pt-3
                               mt-3
                               border-t">
                                    <!-- Student only -->
                                    <button id="deleteProfileBtn" class="hidden
                                   w-full
                                   text-left
                                   px-3
                                   py-2
                                   rounded-lg
                                   text-red-600
                                   hover:bg-red-50" type="button">
                                        <i class="fa-regular
                                       fa-trash-can
                                       mr-2"></i>
                                        Delete Profile
                                    </button>
                                    <!-- Logout -->
                                    <button id="profileLogoutBtn" class="w-full
                                   text-left
                                   px-3
                                   py-2
                                   mt-1
                                   rounded-lg
                                   text-slate-600
                                   hover:bg-slate-50" type="button">
                                        <i class="fa-solid
                                       fa-right-from-bracket
                                       mr-2"></i>
                                        Logout
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>
