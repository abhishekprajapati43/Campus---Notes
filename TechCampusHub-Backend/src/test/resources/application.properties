spring.application.name=TechCampusHub-Backend-Test

# In-memory H2 in PostgreSQL compatibility mode - no external services needed.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Deterministic JWT secret for tests (>= 32 chars required for HS256).
app.jwt.secret=test-secret-0123456789abcdefghijklmnopqrstuv
app.jwt.expiration-ms=3600000

app.base-url=http://localhost:8080
app.cors.allowed-origins=http://localhost:5500
app.security.require-email-verification=false

app.admin.email=admin@test.com
app.admin.password=Admin@1234
app.admin.name=Test Admin

# No SMTP in tests - verification links are logged, tokens stored in DB.
spring.mail.host=
app.mail.from=no-reply@test.com

app.cloudinary.cloud-name=
app.cloudinary.api-key=
app.cloudinary.api-secret=

# Secure PDF streaming: the loopback HttpServer fixture used by
# SecurePdfStreamingIntegrationTest is allowlisted next to Cloudinary.
app.content.stream-hosts=res.cloudinary.com,127.0.0.1
