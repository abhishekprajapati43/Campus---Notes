spring.application.name=TechCampusHub-Backend

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
# Precedence: SERVER_PORT (explicit override) > PORT (Railway/containers
# inject PORT — set your service port to 5050 in Railway) > 8080 (local dev).
server.port=${SERVER_PORT:${PORT:8080}}
server.error.include-message=always
server.error.include-binding-errors=always

# ---------------------------------------------------------------------------
# Database (PostgreSQL)
# ---------------------------------------------------------------------------
# Order: explicit DB_URL/DB_USERNAME/DB_PASSWORD first, then a libpq-style
# connection string (PG_CONNECTION_URL or DATABASE_URL — converted at startup
# by PgConnectionUrlEnvironmentPostProcessor), then the standard
# libpq variables (PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD) that Railway
# injects automatically for a linked Postgres service, then local defaults.
spring.datasource.url=${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:techcampushub_db}}
spring.datasource.username=${DB_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:postgres}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=${DB_FORMAT_SQL:false}

# ---------------------------------------------------------------------------
# Multipart / uploads (Cloudinary bound PDFs and images)
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:15MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
# NOTE: the default below is a development-only secret. Always override via the
# JWT_SECRET environment variable in production (minimum 32 characters).
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdefghijklmnopqrstuvwxyz}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------------
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
# When true, login is rejected until the e-mail address has been verified.
app.security.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:false}

# Bootstrap admin (created on startup if it does not exist yet)
app.admin.email=${ADMIN_EMAIL:admin@techcampushub.com}
app.admin.password=${ADMIN_PASSWORD:Admin@1234}
app.admin.name=${ADMIN_NAME:Administrator}

# ---------------------------------------------------------------------------
# Mail (verification / password-reset e-mails)
# ---------------------------------------------------------------------------
# If no host is configured, e-mail is logged to the console instead of sent.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@techcampushub.com}

# ---------------------------------------------------------------------------
# Cloudinary (only the resulting secure URL is stored in PostgreSQL)
# ---------------------------------------------------------------------------
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:techcampushub}

# ---------------------------------------------------------------------------
# Secure PDF streaming (in-app viewer relay)
# ---------------------------------------------------------------------------
# Host allowlist for GET /api/content/{category}/{id}/pdf - the backend only
# fetches storage URLs whose host equals or is a subdomain of one of these
# entries (comma separated). Plain http is additionally limited to loopback
# addresses, so the allowlist can never be used to reach arbitrary services
# unencrypted.
app.content.stream-hosts=${CONTENT_STREAM_HOSTS:res.cloudinary.com}

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI  ->  /swagger-ui.html , /v3/api-docs
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorting=alpha
springdoc.swagger-ui.tags-sorting=alpha
