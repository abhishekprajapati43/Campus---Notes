# ============================================================
# TechCampus Hub — Render Blueprint
#
# One blueprint provisions the whole project:
#   1. techcampushub-backend  — Spring Boot API (Docker, free plan)
#   2. techcampushub-db       — managed PostgreSQL (free plan)
#   3. techcampushub-frontend — static site (CDN, free plan)
#
# Deploy: Render Dashboard → New + → Blueprint → pick this repo.
# Full walkthrough: DEPLOYMENT.md
# ============================================================

services:
  # ---------- Backend (Spring Boot) ----------
  - type: web
    name: techcampushub-backend
    runtime: docker
    plan: free
    dockerfilePath: TechCampusHub-Backend/Dockerfile
    dockerContext: TechCampusHub-Backend
    autoDeployTrigger: commit
    # Only backend changes trigger a backend rebuild (monorepo hygiene).
    buildFilter:
      paths:
        - TechCampusHub-Backend/**
    healthCheckPath: /api/health
    envVars:
      # Render Postgres hands us a libpq connection string
      # (postgresql://user:pass@host:port/db); the app converts it
      # to JDBC settings at startup (PgConnectionUrlEnvironmentPostProcessor).
      - key: PG_CONNECTION_URL
        fromDatabase:
          name: techcampushub-db
          property: connectionString
      # Random 256-bit JWT signing secret, generated on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Public URLs — if Render appends a suffix to either service URL
      # (name already taken), update these three spots:
      #   - this value
      #   - CORS_ALLOWED_ORIGINS below
      #   - TechCampusHub-Frontend/js/env.js (PROD_API)
      - key: APP_BASE_URL
        value: https://techcampushub-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://techcampushub-frontend.onrender.com,http://localhost:5500,http://127.0.0.1:5500
      # Login works without e-mail verification in production
      # (Render free tier blocks outbound SMTP anyway).
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      # Bootstrap admin account — choose a strong password when the
      # blueprint prompts you and keep it safe.
      - key: ADMIN_EMAIL
        value: admin@techcampushub.com
      - key: ADMIN_PASSWORD
        sync: false

  # ---------- Frontend (static HTML/JS) ----------
  - type: web
    name: techcampushub-frontend
    runtime: static
    autoDeployTrigger: commit
    staticPublishPath: ./TechCampusHub-Frontend
    buildFilter:
      paths:
        - TechCampusHub-Frontend/**

# ---------- PostgreSQL ----------
databases:
  - name: techcampushub-db
    plan: free
    databaseName: techcampushub
    user: techcampushub
