                        <!-- =================================================
                 ADMIN PANEL
            ================================================== -->
                        <section id="adminPanel" class="
                       card
                       p-6
                       mb-5">
                            <div id="adminMessage" class="hidden mb-4 rounded-xl px-4 py-3 text-sm"></div>
                            <div class="flex
                           flex-col
                           md:flex-row
                           md:items-center
                           md:justify-between
                           gap-4
                           mb-5">
                                <div>
                                    <h2 class="text-xl
                                   font-extrabold">
                                        Administrator Panel
                                    </h2>
                                    <p class="text-sm
                                   text-slate-500">
                                        Upload and manage
                                college resources
                                    </p>
                                </div>
                                <select id="adminUploadType" class="input
                               max-w-xs">
                                    <option value="notes">
                                        Notes
                                    </option>
                                    <option value="tnp">
                                        TNP
                                    </option>
                                    <option value="pyq">
                                        PYQ
                                    </option>
                                    <option value="timetable">
                                        Exam Timetable
                                    </option>
                                </select>
                            </div>
                            <!-- =================================================
                     NOTES UPLOAD
                ================================================== -->
                            <form id="uploadNotesForm" class="grid
                           md:grid-cols-2
                           lg:grid-cols-4
                           gap-4">
                                <input
                                    id="noteSubject"
                                    class="input"
                                    placeholder="Subject"
                                    required
                                >
                                <input id="noteTitle" class="input" placeholder="Title / Topic">
                                <select id="noteCourse" class="input" required></select>
                                <select id="noteBranch" class="input" required></select>
                                <select id="noteYear" class="input" required></select>
                                <select id="noteSemester" class="input" required></select>
                                <input
                                    id="noteFile"
                                    class="input
                               lg:col-span-2"
                                    type="file"
                                    accept="application/pdf"
                                    required
                                >
                                <button type="submit" class="bg-blue-600
                               hover:bg-blue-700
                               text-white
                               rounded-xl
                               font-bold
                               py-3
                               transition">
                                    Upload Notes
                                </button>
                            </form>
                            <!-- =================================================
                     TNP UPLOAD
                ================================================== -->
                            <form id="uploadTnpForm" class="hidden
                           grid
                           md:grid-cols-3
                           gap-4">
                                <input
                                    id="tnpSubject"
                                    class="input"
                                    placeholder="Subject"
                                    required
                                >
                                <input id="tnpTitle" class="input" placeholder="Title / Topic">
                                <input
                                    id="tnpFile"
                                    class="input"
                                    type="file"
                                    accept="application/pdf"
                                    required
                                >
                                <button type="submit" class="bg-blue-600
                               hover:bg-blue-700
                               text-white
                               rounded-xl
                               font-bold
                               py-3
                               md:col-span-3">
                                    Upload TNP
                                </button>
                            </form>
                            <!-- =================================================
                     PYQ UPLOAD
                ================================================== -->
                            <form id="uploadPyqForm" class="hidden
                           grid
                           md:grid-cols-2
                           lg:grid-cols-4
                           gap-4">
                                <select id="pyqCourse" class="input" required></select>
                                <select id="pyqYear" class="input" required></select>
                                <select id="pyqSemester" class="input" required></select>
                                <input
                                    id="pyqSubject"
                                    class="input"
                                    placeholder="Subject"
                                    required
                                >
                                <input id="pyqTitle" class="input" placeholder="Title">
                                <input
                                    id="pyqFile"
                                    class="input
                               lg:col-span-2"
                                    type="file"
                                    accept="application/pdf"
                                    required
                                >
                                <button type="submit" class="bg-blue-600
                               hover:bg-blue-700
                               text-white
                               rounded-xl
                               font-bold
                               py-3">
                                    Upload PYQ
                                </button>
                            </form>
                            <!-- =================================================
     TIMETABLE UPLOAD
================================================== -->
                            <form id="uploadTimetableForm" class="hidden grid md:grid-cols-2 lg:grid-cols-4 gap-4">
                                <!-- Course -->
                                <select id="timetableCourse" class="input" required>
                                    <option value disabled selected>
                                        Select Course
                                    </option>
                                </select>
                                <!-- Semester -->
                                <select id="timetableSemester" class="input" required>
                                    <option value disabled selected>
                                        Select Semester
                                    </option>
                                </select>
                                <!-- Exam Year -->
                                <input
                                    id="timetableExamYear"
                                    class="input"
                                    type="number"
                                    placeholder="Exam Year"
                                    min="2000"
                                    max="2100"
                                    required
                                >
                                <!-- Exam Type -->
                                <select id="timetableExamType" class="input" required>
                                    <option value disabled selected>
                                        Select Exam Type
                                    </option>
                                    <option value="Semester Exam">
                                        Semester Exam
                                    </option>
                                    <option value="Practical">
                                        Practical
                                    </option>
                                    <option value="Placement Exam">
                                        Placement Exam
                                    </option>
                                </select>
                                <!-- Timetable File -->
                                <div class="md:col-span-2 lg:col-span-4">
                                    <label for="timetableFile" class="block text-sm font-semibold mb-2">
                                        Upload Timetable File
                                    </label>
                                    <input
                                        id="timetableFile"
                                        type="file"
                                        class="input w-full"
                                        accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
                                        required
                                    >
                                </div>
                                <!-- Upload Button -->
                                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold py-3 lg:col-span-4">
                                    Upload Timetable
                                </button>
                            </form>
                            <!-- =================================================
     COMMUNITY SETTINGS
================================================== -->
                            <div class="mt-8
           pt-6
           border-t
           border-slate-200">
                                <div class="mb-4">
                                    <h3 class="text-lg
                   font-extrabold
                   text-slate-900">
                                        Community Settings
                                    </h3>
                                    <p class="text-sm
                   text-slate-500
                   mt-1">
                                        Update the Telegram link for students.
                                    </p>
                                </div>
                                <div class="grid
               md:grid-cols-[1fr_auto]
               gap-3
               items-end">
                                    <!-- Telegram Link -->
                                    <div>
                                        <label for="telegramLinkInput" class="block
                       text-sm
                       font-semibold
                       mb-2">
                                            Telegram Link
                                        </label>
                                        <input
                                            id="telegramLinkInput"
                                            class="input"
                                            type="url"
                                            value="https://t.me/TechCampus_Hub"
                                            placeholder="https://t.me/TechCampus_Hub"
                                            autocomplete="off"
                                        >
                                    </div>
                                    <!-- Update Button -->
                                    <button id="updateTelegramLinkBtn" type="button" class="bg-blue-600
                   hover:bg-blue-700
                   text-white
                   font-bold
                   px-6
                   py-3
                   rounded-xl
                   transition">
                                        <i class="fa-solid
                       fa-rotate
                       mr-2"></i>
                                        Update Link
                                    </button>
                                </div>
                                <!-- Message -->
                                <p id="telegramSettingsMessage" class="text-sm
               mt-3
               min-h-5"></p>
                            </div>
                        </section>
